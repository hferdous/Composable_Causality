[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtcd"
version = "1.0.0"
description = "Composable Causality (DTCD): a composable generator of multivariate time series with ground-truth causal graphs and exact counterfactual twins, for benchmarking causal discovery and treatment-effect estimation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Muhammad Hasan Ferdous", email = "h.ferdous@umbc.edu"},
    {name = "Md Osman Gani", email = "mogani@umbc.edu"},
]
keywords = ["causal discovery", "time series", "benchmark", "synthetic data",
            "counterfactual", "treatment effect", "CATE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "optuna>=3.2.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
# Third-party discovery baselines (PCMCI family, VARLiNGAM, CD-NOD, GrangerF).
discovery = [
    "tigramite>=5.2.0",
    "dcor>=0.6",
    "causal-learn>=0.1.3",
    "lingam>=1.8.0",
    "statsmodels>=0.14.0",
]
# Neural baselines (CUTS+, Rhino, NeuralGC).
deep = [
    "torch>=2.0.0",
]
# CATE estimators and rank statistics.
cate = [
    "catenets>=0.2.0",
    "econml>=0.14.1",
    "autorank>=1.1.0",
]
# Optional Structural Intervention Distance; not used in the paper.
sid = [
    "cdt>=0.6.0",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/hferdous/Composable_Causality"
Repository = "https://github.com/hferdous/Composable_Causality"
Issues = "https://github.com/hferdous/Composable_Causality/issues"
